<section class="py-16 bg-gray-200 grid grid-cols-1 md:grid-cols-3 gap-8 px-6">
  <!-- Sidebar Filter -->
  <aside class="bg-white rounded-2xl shadow-sm border border-blue-100 space-y-8 h-fit">
    <!-- Header -->
    <div class="border-b pb-4 flex justify-between items-center px-6 pt-4">
      <h2 class="font-semibold text-gray-700">Filter</h2>
      <button id="clear-filters" class="text-blue-600 text-sm hover:underline">
        Clear
      </button>
    </div>

    <!-- Category -->
    <div class="px-6 space-y-3">
      <h3 class="font-semibold text-gray-700">Category</h3>
      <input
        type="text"
        id="category-search"
        placeholder="Search category..."
        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500"
      />
      <div id="category-list" class="space-y-2 text-sm text-gray-600">
        <!-- Will be populated by JavaScript -->
      </div>
      <div id="category-show-more" class="hidden">
        <!-- Show More button will be added here -->
      </div>
    </div>

    <!-- Tags -->
    <div class="px-6 space-y-3">
      <h3 class="font-semibold text-gray-700">Tags</h3>
      
      <!-- Search input -->
      <input
        type="text"
        id="tag-search"
        placeholder="Search tags..."
        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500"
      />
      
      <!-- Tags container with grid layout -->
      <div id="tag-list" class="text-sm max-h-64 overflow-y-auto pr-1">
        <!-- Will be populated by JavaScript -->
      </div>
    </div>

    <!-- Sources -->
    <div class="px-6 space-y-3">
      <h3 class="font-semibold text-gray-700">Sources</h3>
      <input
        type="text"
        id="source-search"
        placeholder="Search sources..."
        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500"
      />
      <div id="source-list" class="space-y-2 text-sm text-gray-600">
        <!-- Populated by JavaScript -->
      </div>
    </div>

    <!-- Publication Date -->
    <div class="px-6 pb-6 space-y-3">
      <h3 class="font-semibold text-gray-700">Publication Date</h3>
      <div class="space-y-3">
        <div class="flex items-center gap-3">
          <!-- Start Date -->
          <div class="relative flex-1">
            <div class="absolute inset-y-0 start-0 flex items-center ps-3.5 pointer-events-none">
              <svg class="w-4 h-4 text-gray-400" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"></path>
              </svg>
            </div>
            <input
              type="date"
              id="start-date"
              class="w-full ps-10 bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block p-2.5 shadow-sm hover:border-gray-400 transition-colors"
              placeholder="Start date"
            >
          </div>
          
          <!-- Arrow -->
          <div class="flex-shrink-0">
            <span class="text-gray-400">to</span>
          </div>
          
          <!-- End Date -->
          <div class="relative flex-1">
            <div class="absolute inset-y-0 start-0 flex items-center ps-3.5 pointer-events-none">
              <svg class="w-4 h-4 text-gray-400" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"></path>
              </svg>
            </div>
            <input
              type="date"
              id="end-date"
              class="w-full ps-10 bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block p-2.5 shadow-sm hover:border-gray-400 transition-colors"
              placeholder="End date"
            >
          </div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="col-span-2">
    <div class="sort flex flex-wrap justify-between items-center mb-6 gap-4">
      <div class="flex gap-4">
        <p id="count-articals" class="text-gray-600">0 Articles</p>
        <p id="count-words" class="text-gray-600">0 Words</p>
      </div>
      
      <!-- Wrap sort controls in a container with proper positioning -->
      <div class="sort-control flex flex-wrap items-center gap-3 relative overflow-visible z-50">
        <!-- SORT DROPDOWN -->
        <div class="relative">
          <button
            id="sortDropdownButton"
            class="inline-flex items-center gap-2 bg-white border border-gray-300 text-gray-700
                   hover:bg-gray-50 focus:ring-2 focus:ring-blue-500
                   shadow-sm font-medium rounded-lg text-sm px-4 py-2.5 transition"
            type="button"
          >
            <i class="fas fa-sort text-xs text-gray-500"></i>
            <span id="sort-label">Most Recent</span>
            <svg class="w-4 h-4 ms-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="m19 9-7 7-7-7"/>
            </svg>
          </button>

          <div
            id="sortDropdown"
            class="hidden absolute bg-white border border-gray-200 rounded-lg shadow-lg w-44 z-50"
          >
            <ul class="py-2 text-sm text-gray-700">
              <li>
                <button
                  data-sort="newest"
                  class="flex items-center gap-2 w-full px-4 py-2 hover:bg-gray-100 text-left"
                >
                  <i class="fas fa-clock text-xs text-gray-400"></i>
                  Most Recent
                </button>
              </li>
              <li>
                <button
                  data-sort="oldest"
                  class="flex items-center gap-2 w-full px-4 py-2 hover:bg-gray-100 text-left"
                >
                  <i class="fas fa-history text-xs text-gray-400"></i>
                  Oldest First
                </button>
              </li>
            </ul>
          </div>
        </div>

        <!-- EXPORT DROPDOWN -->
        <div class="relative">
          <button
            id="exportDropdownButton"
            class="inline-flex items-center gap-2 bg-green-600 text-white
                   hover:bg-green-700 focus:ring-2 focus:ring-green-400
                   shadow-sm font-medium rounded-lg text-sm px-4 py-2.5 transition"
            type="button"
          >
            <i class="fas fa-file-export text-sm"></i>
            Export
            <svg class="w-4 h-4 ms-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="m19 9-7 7-7-7"/>
            </svg>
          </button>

          <div
            id="exportDropdown"
            class="hidden absolute bg-white border border-gray-200 rounded-lg shadow-lg w-44 z-50"
          >
            <ul class="py-2 text-sm text-gray-700">
              <li>
                <button data-export="csv" class="flex items-center gap-2 w-full px-4 py-2 hover:bg-gray-100 text-left">
                  <i class="fas fa-file-csv text-xs text-gray-400"></i>
                  Export CSV
                </button>
              </li>
              <li>
                <button data-export="excel" class="flex items-center gap-2 w-full px-4 py-2 hover:bg-gray-100 text-left">
                  <i class="fas fa-file-excel text-xs text-gray-400"></i>
                  Export Excel
                </button>
              </li>
              <li>
                <button data-export="json" class="flex items-center gap-2 w-full px-4 py-2 hover:bg-gray-100 text-left">
                  <i class="fas fa-file-code text-xs text-gray-400"></i>
                  Export JSON
                </button>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>

    <!-- Dataset Cards -->
    <div id="cards" class="grid sm:grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Populated by JavaScript -->
    </div>

    <!-- Pagination -->
    <div class="flex justify-center w-full">
      <nav aria-label="Page navigation" class="flex items-center gap-4 mt-6">
        <ul class="flex -space-x-px text-sm">
          <li>
            <a 
              href="#"
              id="prev-page"
              class="flex items-center justify-center bg-gray-100 text-gray-700 border border-gray-300 hover:bg-gray-200 rounded-l-lg px-3 h-9">
              Previous
            </a>
          </li>
          <li>
            <span id="page-info" class="flex items-center justify-center bg-gray-100 text-gray-700 border border-gray-300 px-3 h-9 text-xs">
              Page 1
            </span>
          </li>
          <li>
            <a 
              href="#"
              id="next-page"
              class="flex items-center justify-center bg-gray-100 text-gray-700 border border-gray-300 hover:bg-gray-200 rounded-r-lg px-3 h-9">
              Next
            </a>
          </li>
        </ul>

        <form class="w-32">
          <select
            id="per-page"
            class="block w-full px-3 py-2 bg-gray-100 border border-gray-300 text-gray-700 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500">
            <option value="10">10 per page</option>
            <option value="25">25 per page</option>
            <option value="50">50 per page</option>
            <option value="100">100 per page</option>
          </select>
        </form>
      </nav>
    </div>
  </div>
</section>

<style>
  /* Fix dropdown overflow issues */
  .relative {
    position: relative !important;
  }
  
  /* Ensure dropdowns are positioned absolutely and appear above content */
  .z-50 {
    z-index: 50 !important;
  }
  
  /* Custom positioning for dropdowns */
  #sortDropdown,
  #exportDropdown {
    position: absolute !important;
    top: 100% !important;
    left: 0 !important;
    margin-top: 4px !important;
  }
</style>
