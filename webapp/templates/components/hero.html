<section class="hero bg-gradient-to-r from-blue-600 to-blue-700 text-white py-16">
  <div class="container mx-auto px-4 text-center">
    <h1 class="text-4xl md:text-5xl font-bold mb-4">
      JONGROK Khmer Language Corpora
    </h1>
    <p class="text-xl mb-6">
      Powered by the JONGROK Multi-Agent Text Extraction System — your digital granary for freely accessible Khmer-language data.
    </p>

    <!-- Larger Search Form -->
    <div class="max-w-3xl mx-auto">
      <div class="flex shadow-md rounded-xl overflow-hidden">
        <!-- Dropdown Button -->
        <button
          id="dropdown-button"
          data-dropdown-toggle="dropdown"
          type="button"
          class="inline-flex items-center shrink-0 z-10 text-gray-800 bg-white border border-gray-300 hover:bg-gray-100 focus:ring-4 focus:ring-blue-300 font-medium text-base px-6 py-4 rounded-s-xl focus:outline-none"
        >
          <svg class="w-5 h-5 mr-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.143 4H4.857A.857.857 0 0 0 4 4.857v4.286c0 .473.384.857.857.857h4.286A.857.857 0 0 0 10 9.143V4.857A.857.857 0 0 0 9.143 4Zm10 0h-4.286a.857.857 0 0 0-.857.857v4.286c0 .473.384.857.857.857h4.286A.857.857 0 0 0 20 9.143V4.857A.857.857 0 0 0 19.143 4Zm-10 10H4.857a.857.857 0 0 0-.857.857v4.286c0 .473.384.857.857.857h4.286a.857.857 0 0 0 .857-.857v-4.286A.857.857 0 0 0 9.143 14Zm10 0h-4.286a.857.857 0 0 0-.857.857v4.286c0 .473.384.857.857.857h4.286a.857.857 0 0 0 .857-.857v-4.286a.857.857 0 0 0-.857-.857Z"/></svg>
          All Categories
          <svg class="w-5 h-5 ml-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 9-7 7-7-7"/></svg>
        </button>

        <!-- Dropdown Menu -->
        <div id="dropdown" class="z-10 hidden bg-white border border-gray-300 rounded-xl shadow-lg w-48 text-gray-800">
          <ul id="dropdown-menu" class="p-2 text-base font-medium" aria-labelledby="dropdown-button">
            <li><a href="#" class="block p-2 rounded-md hover:bg-gray-100">Loading categories...</a></li>
          </ul>
        </div>

        <!-- Input -->
        <input
          type="search"
          id="search-dropdown"
          class="flex-grow px-6 py-4 bg-white border-t border-b border-gray-300 text-gray-800 text-base focus:ring-blue-500 focus:border-blue-500 placeholder-gray-500"
          placeholder="Search Khmer corpora..."
          required
        />

        <!-- Search Button -->
        <button
          type="button"
          id="search-button"
          class="inline-flex items-center text-white bg-blue-600 hover:bg-blue-700 border border-transparent focus:ring-4 focus:ring-blue-300 font-medium text-base px-6 py-4 rounded-e-xl focus:outline-none"
        >
          <svg class="w-5 h-5 mr-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"/></svg>
          Search
        </button>
      </div>
    </div>

    <!-- Stats (Dynamic) -->
    <div id="stats-container" class="mt-10 flex flex-wrap justify-center gap-4">
      <div class="bg-white/20 backdrop-blur-sm px-6 py-3 rounded-full">
        <span class="font-bold">Loading...</span>
      </div>
    </div>
  </div>
</section>
<script src="{{ url_for('static', filename='js/index.js') }}"></script>
<script>
  // Dropdown toggle
  document.getElementById('dropdown-button')?.addEventListener('click', () => {
    const dropdown = document.getElementById('dropdown');
    if (dropdown) {
      dropdown.classList.toggle('hidden');
    }
  });

  // Close dropdown when clicking outside
  document.addEventListener('click', (e) => {
    const dropdown = document.getElementById('dropdown');
    const dropdownButton = document.getElementById('dropdown-button');
    if (dropdown && !dropdown.contains(e.target) && e.target !== dropdownButton) {
      dropdown.classList.add('hidden');
    }
  });

  // Search button handler
  document.getElementById('search-button')?.addEventListener('click', (e) => {
    e.preventDefault();
    const searchInput = document.getElementById('search-dropdown');
    if (searchInput && window.searchCategories) {
      const searchValue = searchInput.value.trim();
      window.searchCategories(searchValue);
      
      // Scroll to cards section
      const cardsSection = document.getElementById('corpora-container');
      if (cardsSection) {
        setTimeout(() => {
          cardsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 100);
      }
    }
  });

  // Allow Enter key to search
  document.getElementById('search-dropdown')?.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      document.getElementById('search-button')?.click();
    }
  });
</script>
